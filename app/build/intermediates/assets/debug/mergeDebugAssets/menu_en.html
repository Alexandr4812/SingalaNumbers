<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>සිංහල · menu</title>
<style>
:root{
  --paper:#efe8da; --card:#f7f1e3;
  --ink:#342f28; --sumi:#24221f;
  --dim:#7a7265; --faint:#a79d8b;
  --line:#d4c9b0;
  --ai:#5a6b7a; --matcha:#7a8c6e; --beni:#b8695a; --yamabuki:#c9a961;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100%}
body{font-family:Georgia,'Times New Roman','Noto Sans Sinhala',serif;background:var(--paper);color:var(--ink);min-height:100vh;touch-action:pan-y;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
.masthead{padding:44px 0 22px;border-bottom:3px double var(--sumi)}
.kicker{font-size:.68rem;letter-spacing:.28em;text-transform:uppercase;color:var(--ai);margin-bottom:8px}
h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:700;margin:0;display:inline-flex;align-items:center;gap:.35em;flex-wrap:wrap}
h1 .mark{color:var(--beni);font-style:italic;font-weight:400}
.eleph{width:1.1em;height:1.1em;flex:none;display:inline-block;vertical-align:middle}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:30px 0 10px}
.mcard{border:1px solid var(--line);background:var(--card);border-radius:3px;padding:26px 22px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:10px;min-height:200px;transition:.15s}
.mcard:hover{border-color:var(--sumi);transform:translateY(-2px)}
.mcard .glyph{font-size:2.8rem;line-height:1;color:var(--beni)}
.mcard h2{font-size:1.3rem;font-weight:700}
.mcard p{font-size:.84rem;color:var(--dim);line-height:1.55}
.mcard .go{margin-top:auto;font-size:.74rem;color:var(--ai);letter-spacing:.14em;text-transform:uppercase}
.foot{border-top:3px double var(--sumi);margin-top:40px;padding:14px 0 40px;font-size:.8rem;color:var(--dim);text-align:center}
.foot .mark{color:var(--beni);font-style:italic}
@media(max-width:560px){.menu-grid{grid-template-columns:1fr}.mcard{min-height:150px}}
:root[data-theme="dark"]{
  --paper:#3b3731;
  --card:#474239;
  --ink:#e9e2d4;
  --sumi:#efe8da;
  --dim:#b3aa99;
  --faint:#8f8677;
  --line:#5d5649;
  --ai:#9db3c4;
  --matcha:#a3b899;
  --beni:#d08a76;
  --yamabuki:#d9b878;
}
::selection{background:var(--yamabuki);color:#26221e}
:root[data-theme="dark"] ::selection{background:var(--yamabuki);color:#26221e}
:root[data-theme="dark"] .d-back,
:root[data-theme="dark"] .s-back,
:root[data-theme="dark"] .lc-back,
:root[data-theme="dark"] .demo-back{background:#201d1a;border-color:#201d1a;color:#efe8da}
:root[data-theme="dark"] .d-back .d-word,
:root[data-theme="dark"] .s-back .s-word,
:root[data-theme="dark"] .demo-back .d-word,
:root[data-theme="dark"] .lc-back .lc-lat{color:#efe8da}
:root[data-theme="dark"] .cta{background:#e9e2d4;border-color:#e9e2d4;color:#26221e}
:root[data-theme="dark"] .cta-ghost{background:none;color:#e9e2d4;border-color:#8f8677}
:root[data-theme="dark"] .ans-yes{background:#e9e2d4;border-color:#e9e2d4;color:#26221e}
:root[data-theme="dark"] .opt.good,
:root[data-theme="dark"] .tcell.good,
:root[data-theme="dark"] .tcell.reveal{background:#3e4a3d;border-color:var(--matcha);color:var(--matcha)}
:root[data-theme="dark"] .opt.bad,
:root[data-theme="dark"] .tcell.bad{background:#4b3a34;border-color:var(--beni);color:var(--beni)}
:root[data-theme="dark"] .know.on{background:var(--matcha);border-color:var(--matcha);color:#26221e}
:root[data-theme="dark"] .mchip{background:#565045}
:root[data-theme="dark"] .modal{background:rgba(18,16,14,.72)}
:root[data-theme="dark"] .modal-card{background:#474239;border-color:#8f8677}
:root[data-theme="dark"] .eleph [fill="#3b3733"]{fill:#ded5c2}
:root[data-theme="dark"] .eleph [stroke="#3b3733"]{stroke:#ded5c2}
:root[data-theme="dark"] .eleph [fill="#2c2926"]{fill:#c2b8a4}
:root[data-theme="dark"] .eleph circle[fill="#f3ecdd"]{fill:#3b3731}
:root[data-theme="dark"] .eleph path[stroke="#f3ecdd"]{stroke:#3b3731}
:root[data-theme="dark"] .eleph circle[fill="#e2b478"]{fill:#c9a961}
</style>
</head>
<body>

    </h1>
  </header>
  <div class="menu-grid">
    <a class="mcard" href="index_en.html">
      <span class="glyph">෫</span>

  <footer class="foot"><span><span class="mark">සුබ පැතුම්</span> — happy learning!</span></footer>
</div>
</body>
<script>
function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
}
</script>
</html>
