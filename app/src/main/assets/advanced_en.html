<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Advanced numbers · සිංහල</title>
<style>
:root{
  --paper:#efe8da; --card:#f7f1e3;
  --ink:#342f28; --sumi:#24221f;
  --dim:#7a7265; --faint:#a79d8b;
  --line:#d4c9b0;
  --ai:#5a6b7a;
  --matcha:#7a8c6e;
  --beni:#b8695a;
  --yamabuki:#c9a961;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100%}
::selection{background:var(--yamabuki);color:var(--sumi)}
body{
  font-family:Georgia,'Times New Roman','Noto Sans Sinhala',serif;
  background:var(--paper);color:var(--ink);min-height:100vh;
  touch-action:pan-y;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
.masthead{padding:34px 0 18px;border-bottom:3px double var(--sumi);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.kicker{font-size:.68rem;letter-spacing:.28em;text-transform:uppercase;color:var(--ai)}
h1{font-size:clamp(1.5rem,4.5vw,2.2rem);font-weight:700;margin:6px 0 8px;letter-spacing:-.5px}
h1 .mark{color:var(--beni);font-style:italic;font-weight:400}
.lede{color:var(--dim);font-size:.9rem;line-height:1.55;max-width:55ch;margin-top:6px}
.lede b{color:var(--ink)}
.back{font-family:inherit;font-size:.82rem;color:var(--ai);text-decoration:none;border-bottom:1px dotted var(--ai);padding-bottom:1px}
.back:hover{color:var(--beni);border-color:var(--beni)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 18px;align-items:center}
.chip{background:var(--card);border:1px solid var(--line);padding:6px 13px;font-family:inherit;font-size:.8rem;color:var(--dim);cursor:pointer;border-radius:2px;transition:.15s}
.chip:hover{border-color:var(--ai);color:var(--ink)}
.chip.on{border-color:var(--sumi);color:var(--sumi);background:var(--paper)}
.ghost{background:none;border:none;font-family:inherit;font-size:.78rem;color:var(--ai);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-style:dotted;margin-left:auto}
.ghost:hover{color:var(--beni)}

.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding-bottom:40px}
.dcard{aspect-ratio:5/6;perspective:800px;cursor:pointer;user-select:none;border-radius:3px}
.flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .5s ease}
.dcard.flipped .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);background:var(--card);border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;transform:rotateY(0deg) translateZ(0)}
.d-num{font-size:1.85rem;font-weight:700;color:var(--sumi);line-height:1}
.d-si{font-size:.78rem;color:var(--ai);text-align:center;line-height:1.3}
.d-back{transform:rotateY(180deg) translateZ(0);background:var(--sumi);color:var(--paper);border-color:var(--sumi)}
.d-word{font-weight:600;text-align:center;line-height:1.25;color:var(--paper);padding:0 4px}
.wl-s{font-size:1.35rem}.wl-m{font-size:1.15rem}.wl-l{font-size:.98rem}.wl-xl{font-size:.85rem}
.d-meta{font-size:.64rem;color:var(--yamabuki);opacity:.8;text-align:center}

.foot{border-top:3px double var(--sumi);padding:14px 0 40px;font-size:.8rem;color:var(--dim);text-align:center}
.foot .mark{color:var(--beni);font-style:italic}

@media(max-width:560px){
  .deck{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .toolbar{flex-direction:column;align-items:stretch}
  .ghost{margin-left:0;text-align:center}
}
/* ---------- dark theme: night paper ---------- */
:root[data-theme="dark"]{
  --paper:#3b3731;
  --card:#474239;
  --ink:#e9e2d4;
  --sumi:#efe8da;
  --dim:#b3aa99;
  --faint:#8f8677;
  --line:#5d5649;
  --ai:#9db3c4;
  --matcha:#a3b899;
  --beni:#d08a76;
  --yamabuki:#d9b878;
}
::selection{background:var(--yamabuki);color:#26221e}
:root[data-theme="dark"] ::selection{background:var(--yamabuki);color:#26221e}
:root[data-theme="dark"] .d-back,
:root[data-theme="dark"] .s-back,
:root[data-theme="dark"] .lc-back,
:root[data-theme="dark"] .demo-back{background:#201d1a;border-color:#201d1a;color:#efe8da}
:root[data-theme="dark"] .d-back .d-word,
:root[data-theme="dark"] .s-back .s-word,
:root[data-theme="dark"] .demo-back .d-word,
:root[data-theme="dark"] .lc-back .lc-lat{color:#efe8da}
:root[data-theme="dark"] .cta{background:#e9e2d4;border-color:#e9e2d4;color:#26221e}
:root[data-theme="dark"] .cta-ghost{background:none;color:#e9e2d4;border-color:#8f8677}
:root[data-theme="dark"] .ans-yes{background:#e9e2d4;border-color:#e9e2d4;color:#26221e}
:root[data-theme="dark"] .opt.good,
:root[data-theme="dark"] .tcell.good,
:root[data-theme="dark"] .tcell.reveal{background:#3e4a3d;border-color:var(--matcha);color:var(--matcha)}
:root[data-theme="dark"] .opt.bad,
:root[data-theme="dark"] .tcell.bad{background:#4b3a34;border-color:var(--beni);color:var(--beni)}
:root[data-theme="dark"] .know.on{background:var(--matcha);border-color:var(--matcha);color:#26221e}
:root[data-theme="dark"] .mchip{background:#565045}
:root[data-theme="dark"] .modal{background:rgba(18,16,14,.72)}
:root[data-theme="dark"] .modal-card{background:#474239;border-color:#8f8677}
:root[data-theme="dark"] .eleph [fill="#3b3733"]{fill:#ded5c2}
:root[data-theme="dark"] .eleph [stroke="#3b3733"]{stroke:#ded5c2}
:root[data-theme="dark"] .eleph [fill="#2c2926"]{fill:#c2b8a4}
:root[data-theme="dark"] .eleph circle[fill="#f3ecdd"]{fill:#3b3731}
:root[data-theme="dark"] .eleph path[stroke="#f3ecdd"]{stroke:#3b3731}
:root[data-theme="dark"] .eleph circle[fill="#e2b478"]{fill:#c9a961}
</style>

</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div>
      <div class="kicker">සිංහල · advanced numbers</div>
      <h1>Hundreds and thousands <span class="mark">composite</span></h1>
      <p class="lede">Composite numbers: from <b>125</b> to <b>10000</b>. Tap a card to see the transliteration. Sinhala builds them as a sum: hundred + twenty + five.</p>
    </div>
    <a href="index_en.html" class="back">← to the main deck</a>
  </header>

  <div class="toolbar">
    <button class="chip on" data-f="all">All · 20</button>
    <button class="chip" data-f="hund">100–999</button>
    <button class="chip" data-f="thou">1000+</button>
    <button class="ghost" id="revealBtn">Show answers</button>
  </div>

  <div class="deck" id="deckGrid"></div>

  <footer class="foot">
    <span><span class="mark">සුබ පැතුම්</span> — good luck with big numbers!</span>
  </footer>
</div>

<script>
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));

// Advanced numbers. Latin transliteration follows Sinhala spelling.
const ADV=[
  {n:125, w:'siya visi panaha', si:'සියය විසි පහ', grp:'hund'},
  {n:150, w:'siya panaha', si:'සියය පනහ', grp:'hund'},
  {n:175, w:'siya heththeva panaha', si:'සියය හැත්තෑව පහ', grp:'hund'},
  {n:225, w:'de siya visi panaha', si:'දෙසියය විසි පහ', grp:'hund'},
  {n:250, w:'de siya panaha', si:'දෙසියය පනහ', grp:'hund'},
  {n:375, w:'tun siya heththeva panaha', si:'තුන්සියය හැත්තෑව පහ', grp:'hund'},
  {n:450, w:'hathara siya panaha', si:'හතරසියය පනහ', grp:'hund'},
  {n:550, w:'pan siya panaha', si:'පන්සියය පනහ', grp:'hund'},
  {n:625, w:'haya siya visi panaha', si:'හයසියය විසි පහ', grp:'hund'},
  {n:750, w:'hatha siya panaha', si:'හත්සියය පනහ', grp:'hund'},
  {n:875, w:'ata siya heththeva panaha', si:'අටසියය හැත්තෑව පහ', grp:'hund'},
  {n:950, w:'nava siya panaha', si:'නවසියය පනහ', grp:'hund'},
  {n:1500, w:'dahasa pansiyaya', si:'දහස පන්සියය', grp:'thou'},
  {n:2000, w:'de dahasa', si:'දෙදහස', grp:'thou'},
  {n:2500, w:'de dahasa pansiyaya', si:'දෙදහස පන්සියය', grp:'thou'},
  {n:3000, w:'tun dahasa', si:'තුන්දහස', grp:'thou'},
  {n:5000, w:'pan dahasa', si:'පන්දහස', grp:'thou'},
  {n:10000, w:'das dahasa', si:'දහස් දහස', grp:'thou'},
  {n:1265, w:'dahasa de siya heta panaha', si:'දහස දෙසියය හැට පහ', grp:'thou'},
  {n:2345, w:'de dahasa tun siya hathalis panaha', si:'දෙදහස තුන්සියය හතළිස් පහ', grp:'thou'},
];
const TOTAL=ADV.length;
const KEY='sinhala-adv-v1';
let store=(()=>{try{const s=JSON.parse(localStorage.getItem(KEY));return s&&typeof s==='object'?{known:s.known||{}}:{known:{}};}catch(e){return{known:{}};}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}};
const wlClass=w=>{const L=w.length;return L<=12?'wl-s':L<=20?'wl-m':L<=30?'wl-l':'wl-xl';};

let curFilter='all', reveal=false;

function renderDeck(){
  const g=$('#deckGrid'); g.innerHTML='';
  const list=ADV.filter(w=>curFilter==='all'?true:w.grp===curFilter);
  list.forEach(w=>{
    const d=document.createElement('div');
    d.className='dcard';
    d.tabIndex=0; d.setAttribute('role','button');
    d.innerHTML='<div class="flip-inner">'+
      '<div class="face d-front">'+
        '<span class="d-num">'+w.n+'</span>'+
        '<span class="d-si">'+w.si+'</span>'+
      '</div>'+
      '<div class="face d-back">'+
        '<span class="d-word '+wlClass(w.w)+'">'+w.w+'</span>'+
        '<span class="d-meta">'+w.n+' · '+w.si+'</span>'+
      '</div></div>';
    d.addEventListener('click',()=>d.classList.toggle('flipped'));
    g.appendChild(d);
  });
  if(reveal)$$('#deckGrid .dcard').forEach(c=>c.classList.add('flipped'));
}

$('.toolbar').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  $$('.chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');
  curFilter=b.dataset.f;reveal=false;$('#revealBtn').textContent='Show answers';renderDeck();
});
$('#revealBtn').onclick=()=>{
  reveal=!reveal;
  $$('#deckGrid .dcard').forEach(c=>c.classList.toggle('flipped',reveal));
  $('#revealBtn').textContent=reveal?'Hide answers':'Show answers';
};

function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
}

renderDeck();
</script>
</body>
</html>
